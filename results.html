<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Results — LBD Voting Platform</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="results">

  <header class="site-header">
    <div class="header-inner">
      <a class="home-link" href="index.html" aria-label="Back to Home" title="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <img class="header-logo" src="logo.png" alt="LBD Voting Platform logo">
      <span class="org-name">LBD Voting Platform</span>
    </div>
  </header>

  <div class="time-strip">
    <span id="live-date"></span><span class="sep" aria-hidden="true">·</span><span id="live-time" class="time-value"></span>
  </div>

  <main class="container results-main">
    <div id="thankyou-banner" class="banner success" hidden>
      <strong>Thank you for voting.</strong> Your ballot has been recorded.
    </div>
    <div id="already-banner" class="banner info" hidden>
      <strong>This device has already voted.</strong> Only one vote per device is allowed.
    </div>
    <div id="ended-banner" class="banner ended" hidden>
      <strong>Voting has ended.</strong> These are the final results.
    </div>

    <h1 class="page-title">Live Results</h1>

    <div class="stats-card">
      <div>
        <p class="stats-label muted">Total Votes Cast</p>
        <p id="total-votes" class="total-badge">0</p>
      </div>
      <div class="stats-right">
        <p id="last-updated" class="muted small"></p>
        <button id="refresh-btn" class="btn btn-outline">Refresh</button>
      </div>
    </div>

    <div id="results-error" class="error-box" role="alert" hidden></div>
    <div id="results-container"></div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> LBD Voting Platform</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
